services:
  langgraph-agent:
    build: .
    ports:
      - "127.0.0.1:${LANGSTACK_PORT:-8090}:8090"
    environment:
      A2A_PUBLIC_URL: ${A2A_PUBLIC_URL:-http://127.0.0.1:8090}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-nemotron-3-nano:4b-mlx}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-120}
      RE_LANGSTACK_STATE_DIR: /data
      RE_BEHAVIORS_DIR: /behaviors
    volumes:
      - langstack-state:/data
      # Runtime-neutral agent behaviors (*.agent.json), read-only. Empty by default.
      - ${RE_BEHAVIORS_HOST_DIR:-./behaviors}:/behaviors:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  langstack-state:
